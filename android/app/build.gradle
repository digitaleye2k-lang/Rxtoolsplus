plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rxtools.plus'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rxtools.plus'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1.0." + (System.getenv('VERSION_CODE') ?: '0')
    }

    // A fixed key so each new APK installs as an update over the last one.
    signingConfigs {
        rxtools {
            storeFile file('rxtools-debug.keystore')
            storePassword 'android'
            keyAlias 'rxtools'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.rxtools }
        release {
            minifyEnabled false
            signingConfig signingConfigs.rxtools
        }
    }

    // The web app in /web is the single source of truth — bundled as the app's assets.
    sourceSets {
        main { assets.srcDirs = ['../../web'] }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
